name: CI Pipeline

on:
  push:
    branches: [ main, 'feature/**', 'bugfix/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x gradlew
      
    - name: Run tests with coverage
      run: ./gradlew test jacocoTestReport
      
    - name: Build application
      run: ./gradlew build
      
    - name: Test Results Summary
      if: always()
      run: |
        if [ -f build/test-results/test/TEST-*.xml ]; then
          echo "✅ Tests completed. Check artifacts for detailed reports."
          echo "📊 Test reports: build/reports/tests/test/index.html"
          echo "📈 Coverage report: build/reports/jacoco/test/html/index.html"
        else
          echo "❌ No test results found"
        fi
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      if: always()
      with:
        file: build/reports/jacoco/test/jacocoTestReport.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        
    - name: Upload test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: test-results
        path: |
          build/reports/tests/
          build/test-results/
          build/reports/jacoco/
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: jar-artifact
        path: build/libs/*.jar

  manifests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    # The runner image normally ships kubectl; install a pinned one if it does not,
    # so this job never depends on an unversioned preinstalled tool.
    - name: Ensure kubectl is available
      run: |
        if ! command -v kubectl >/dev/null 2>&1; then
          KUBECTL_VERSION=v1.31.0
          curl -sSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
        fi
        kubectl version --client

    # kubectl ships an embedded kustomize, so this needs no cluster.
    - name: Verify Kustomize overlays pin a version-matched image tag
      run: ./scripts/verify-manifests.sh

  # Builds the image as a local tarball and inspects it. Runs on every branch, so the
  # devtools guard and the vulnerability scan cover pull requests rather than only the
  # refs that push images. No registry credentials needed.
  image:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Verify devtools is absent from the image
      run: ./gradlew verifyNoDevtoolsInImage

    - name: Report image vulnerabilities (HIGH and CRITICAL)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        input: build/jib-image.tar
        format: table
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '0'

    # Gate on CRITICAL only. HIGH findings in a base image are common and often
    # unactionable on our side; failing on them would train people to ignore the job.
    - name: Fail on critical image vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        input: build/jib-image.tar
        format: table
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: '1'

  docker:
    runs-on: ubuntu-latest
    needs: [test, image]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/docker') || startsWith(github.ref, 'refs/heads/feature/minikube')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x gradlew
      
    - name: Extract version and set image tags
      id: version
      run: |
        VERSION=$(grep "version = " build.gradle | cut -d "'" -f 2)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

        # Set environment-specific tags
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          # Production uses semantic version only
          IMAGE_TAG="${VERSION}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
        else
          # Dev/feature branches include commit SHA for uniqueness
          SHORT_SHA=${GITHUB_SHA::7}
          IMAGE_TAG="${VERSION}-dev-${SHORT_SHA}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
        fi

        echo "Extracted version: $VERSION"
        echo "Image tag: $IMAGE_TAG"

    - name: Build and push Docker image
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        DOCKER_REGISTRY: docker.io
        IMAGE_TAG: ${{ steps.version.outputs.IMAGE_TAG }}
      run: |
        if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_TOKEN" ]; then
          echo "⚠️ Docker credentials not configured. Skipping Docker push."
          echo "To enable Docker push, add DOCKER_USERNAME and DOCKER_TOKEN secrets to your repository."
          exit 0
        fi

        echo "Building and pushing Docker image..."
        echo "$DOCKER_TOKEN" | docker login docker.io -u "$DOCKER_USERNAME" --password-stdin

        IMAGE_REF="$DOCKER_REGISTRY/$DOCKER_USERNAME/spring-sse-example"

        # Override the FULL destination image, not jib.to.tags.
        # jib.to.tags only adds tags and still pushes the tag baked into
        # jib.to.image (project.version). On a feature branch that would also
        # republish the plain release tag and clobber the production image.
        ./gradlew jib -Djib.to.image="$IMAGE_REF:$IMAGE_TAG"

        echo "✅ Successfully pushed image: $IMAGE_REF:$IMAGE_TAG"

        # Also tag as 'latest' for main branch only
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ./gradlew jib -Djib.to.image="$IMAGE_REF:latest"
          echo "✅ Also tagged as: latest"
        fi