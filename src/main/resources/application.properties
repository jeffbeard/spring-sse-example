server.port=8080
spring.application.name=sse-example

# CORS allowed origins (comma-separated), consumed by CorsConfig.
# Dev default is permissive; production must override with explicit origins.
app.cors.allowed-origins=*

# SSE limits (see SseProperties). Bound the connection count and give every
# emitter a finite timeout; browser EventSource reconnects automatically.
app.sse.max-connections=1000
app.sse.timeout-ms=300000
app.sse.send-timeout-ms=5000
app.sse.broadcast-threads=4

# Must not be 0 (infinite); kept in step with app.sse.timeout-ms
spring.mvc.async.request-timeout=300000

# Dev tools: enabled by default whenever spring-boot-devtools is on the classpath,
# so no explicit enablement is needed here. Forcing it on unconditionally also applied
# it to production (issue #17); application-production.properties now turns it off.