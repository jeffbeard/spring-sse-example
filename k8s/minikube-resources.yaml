# Minikube-specific resource overrides for local development
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-sse-app
  namespace: spring-sse-example
spec:
  replicas: 1  # Single replica for local development
  template:
    spec:
      containers:
      - name: spring-sse-app
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "minikube"
        - name: JAVA_OPTS
          value: "-Xmx128m -Xms64m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-sse-config
  namespace: spring-sse-example
data:
  # Minikube-specific configuration
  server.port: "8080"
  management.server.port: "8081"
  management.endpoint.health.enabled: "true"
  management.endpoints.web.exposure.include: "health,info,metrics"
  management.endpoint.health.show-details: "always"
  
  # Relaxed CORS for local development
  spring.web.cors.allowed-origins: "*"
  spring.web.cors.allowed-methods: "GET,POST,OPTIONS"
  spring.web.cors.allowed-headers: "*"
  
  # SSE configuration
  spring.mvc.async.request-timeout: "0"
  
  # Debug logging for local development
  logging.level.com.example: "DEBUG"
  logging.level.org.springframework.web: "DEBUG"