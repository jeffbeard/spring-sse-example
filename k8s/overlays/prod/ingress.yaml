apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spring-sse-ingress
  annotations:
    # AWS ALB Controller annotations for EKS Production
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    # SSL configuration - TODO: Add certificate ARN
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:region:account-id:certificate/certificate-id
    # alb.ingress.kubernetes.io/ssl-redirect: "443"
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    # SSE-specific settings with stickiness for production
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.type=app_cookie,stickiness.app_cookie.duration_seconds=86400,deregistration_delay.timeout_seconds=30
    # WAF integration - TODO: Add WAF ARN if using
    # alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:region:account-id:global/webacl/acl-name/acl-id
  labels:
    app.kubernetes.io/name: spring-sse-example
    app.kubernetes.io/component: ingress
    environment: prod
spec:
  ingressClassName: alb
  rules:
  # TODO: Update with actual production domain
  - host: api.your-production-domain.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: spring-sse-service
            port:
              number: 80
      - path: /test.html
        pathType: Exact
        backend:
          service:
            name: spring-sse-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: spring-sse-service
            port:
              number: 80
  # Separate host for management endpoints (optional)
  - host: mgmt.your-production-domain.com
    http:
      paths:
      - path: /actuator
        pathType: Prefix
        backend:
          service:
            name: spring-sse-service
            port:
              number: 8081