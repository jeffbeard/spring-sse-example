apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spring-sse-ingress
  annotations:
    # AWS ALB Controller annotations for EKS
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    # SSE-specific settings
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.type=app_cookie,stickiness.app_cookie.duration_seconds=86400
  labels:
    app.kubernetes.io/name: spring-sse-example
    app.kubernetes.io/component: ingress
    environment: dev
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: spring-sse-service
            port:
              number: 80
      - path: /test.html
        pathType: Exact
        backend:
          service:
            name: spring-sse-service
            port:
              number: 80
      # No /actuator route: this Ingress is internet-facing and actuator has no
      # authentication (issue #13). Probes and the ALB health check reach port 8081
      # in-cluster, which does not require an Ingress path.
      - path: /
        pathType: Prefix
        backend:
          service:
            name: spring-sse-service
            port:
              number: 80