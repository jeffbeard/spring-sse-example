apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: spring-sse-minikube

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

patches:
  - path: deployment-patch.yaml
  - path: configmap-patch.yaml

# The tag must match the version in build.gradle: a tag that was never built
# makes a bare `kubectl apply -k` deploy a nonexistent image (issue #16).
images:
  - name: spring-sse-example
    newName: jeffbeard/spring-sse-example
    newTag: "1.1.0"

labels:
  - pairs:
      app.kubernetes.io/version: "1.1.0"
    # Selectors are immutable on an existing Deployment; never add version there.
    includeSelectors: false