apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-sse-config
  labels:
    app.kubernetes.io/name: spring-sse-example
    app.kubernetes.io/component: config
data:
  # Spring Boot configuration
  server.port: "8080"
  management.server.port: "8081"
  management.endpoint.health.enabled: "true"
  management.endpoints.web.exposure.include: "health,info,metrics"
  management.endpoint.health.show-details: "when_authorized"
  
  # CORS configuration - consumed by CorsConfig (app.cors.allowed-origins).
  # Restrict in production overlays. Methods are fixed in CorsConfig.
  app.cors.allowed-origins: "*"
  
  # SSE configuration - finite timeouts and a connection cap (issue #15).
  # Must not be "0": that restores the unbounded-connection DoS.
  spring.mvc.async.request-timeout: "300000"
  app.sse.max-connections: "1000"
  app.sse.timeout-ms: "300000"
  app.sse.send-timeout-ms: "5000"
  app.sse.broadcast-threads: "4"
  
  # Logging configuration
  logging.level.com.example: "INFO"
  logging.level.org.springframework.web: "INFO"