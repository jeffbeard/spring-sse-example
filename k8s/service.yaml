apiVersion: v1
kind: Service
metadata:
  name: spring-sse-service
  namespace: spring-sse-example
  labels:
    app.kubernetes.io/name: spring-sse-example
    app.kubernetes.io/component: service
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: spring-sse-example
    app.kubernetes.io/component: application
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: management
    port: 8081
    targetPort: management
    protocol: TCP