apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-sse-example
  labels: {app: spring-sse-example}
spec:
  replicas: 1
  selector:
    matchLabels: {app: spring-sse-example}
  template:
    metadata:
      labels: {app: spring-sse-example}
    spec:
      containers:
        - name: spring-sse-example
          image: spring-sse-example:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Local lab only: this Service is not exposed outside the cluster.
            # The k8s/ overlays deliberately expose health alone (issue #13).
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: health,prometheus
          # No management.server.port here, so actuator shares port 8080.
          # The liveness/readiness groups are auto-enabled when Spring detects Kubernetes.
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: spring-sse-example
  labels: {app: spring-sse-example}
spec:
  selector: {app: spring-sse-example}
  ports:
    - name: http
      port: 80
      targetPort: http


