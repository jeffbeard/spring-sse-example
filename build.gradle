plugins {
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'jacoco'
    id 'com.google.cloud.tools.jib' version '3.5.4'
}

group = 'com.example'
version = '1.3.0'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

// Spring Boot puts developmentOnly dependencies on the main runtime classpath, and Jib
// containerizes exactly that classpath. Left alone, devtools ships in the image and —
// because Jib runs an exploded classpath rather than a fat jar — actually activates
// there, opening a LiveReload listener on 35729 (issue #17).
//
// The exclusion is scoped to image builds so that bootRun and IDE runs keep hot reload.
// That scoping is a heuristic, so it is not trusted: verifyNoDevtoolsInImage below
// fails the build if devtools reaches the image by any route.
def imageTaskPattern = ~/(?i).*(jib|verifynodevtoolsinimage).*/
def buildingImage = gradle.startParameter.taskNames.any { imageTaskPattern.matcher(it).matches() }
if (buildingImage) {
    configurations {
        runtimeClasspath {
            exclude group: 'org.springframework.boot', module: 'spring-boot-devtools'
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Adds /actuator/prometheus. Not exposed unless management.endpoints.web.exposure.include
    // lists it; only deploy/app.yaml (the local Argo CD lab) does.
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.5
            }
        }
    }
}

// Gradle services are injected rather than reached through Task.project, which is
// deprecated at execution time and becomes an error in Gradle 10.
interface ImageVerifyServices {
    @javax.inject.Inject FileSystemOperations getFs()
    @javax.inject.Inject ArchiveOperations getArchives()
}

/**
 * Fails the build if spring-boot-devtools reaches the container image (issue #17).
 * Scans the real image tarball rather than reasoning about the classpath, so it holds
 * regardless of how the image was assembled.
 */
tasks.register('verifyNoDevtoolsInImage') {
    group = 'verification'
    description = 'Fails if spring-boot-devtools is present in the built container image'
    dependsOn tasks.named('jibBuildTar')

    def services = objects.newInstance(ImageVerifyServices)
    def imageTarFile = layout.buildDirectory.file('jib-image.tar')
    def workDirectory = layout.buildDirectory.dir('image-verify')

    doLast {
        def imageTar = imageTarFile.get().asFile
        def workDir = workDirectory.get().asFile
        services.fs.delete {
            delete workDir
        }
        services.fs.copy {
            from services.archives.tarTree(imageTar)
            into workDir
        }

        def offenders = []
        def layers = 0
        workDir.eachFileRecurse { file ->
            if (file.name.endsWith('.tar.gz')) {
                layers++
                services.archives.tarTree(services.archives.gzip(file)).visit { entry ->
                    if (entry.name.toLowerCase().contains('devtools')) {
                        offenders << entry.path
                    }
                }
            }
        }

        if (!offenders.isEmpty()) {
            throw new GradleException(
                "spring-boot-devtools found in container image: ${offenders.join(', ')}")
        }
        logger.lifecycle("verifyNoDevtoolsInImage: clean (${layers} layers scanned)")
    }
}

// Jib configuration for Docker image building
jib {
    from {
        // Digest-pinned so the base image cannot change under us (issue #18).
        // The tag is retained for readability; the digest is what is resolved.
        // Refresh with:
        //   TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/eclipse-temurin:pull" | jq -r .token)
        //   curl -sI -H "Authorization: Bearer $TOKEN" \
        //     -H "Accept: application/vnd.oci.image.index.v1+json" \
        //     https://registry-1.docker.io/v2/library/eclipse-temurin/manifests/17-jre | grep -i docker-content-digest
        image = 'eclipse-temurin:17-jre@sha256:541b08fc7f494edf14e436ff6bfb55767e4a115c87bfc547b8c5de957b58737f'
    }
    to {
        // With DOCKER_USERNAME: <registry>/<username>/<name>:<version>, for pushing.
        // Without it: a bare <name>:<version>, the name deploy/app.yaml expects from
        // a local `./gradlew jibDockerBuild`. The Maven group is never part of the name.
        def dockerUsername = System.getenv('DOCKER_USERNAME')
        image = dockerUsername
            ? "${System.getenv('DOCKER_REGISTRY') ?: 'docker.io'}/${dockerUsername}/${project.name}:${project.version}"
            : "${project.name}:${project.version}"
        // Configure auth for Docker Hub using personal access token
        if (System.getenv('DOCKER_USERNAME') != null && System.getenv('DOCKER_TOKEN') != null) {
            auth {
                username = System.getenv('DOCKER_USERNAME')
                password = System.getenv('DOCKER_TOKEN')
            }
        }
    }
    container {
        jvmFlags = ['-Xmx512m', '-Xms256m', '-XX:+UseG1GC', '-XX:MaxGCPauseMillis=200']
        ports = ['8080']
        user = '1001:1001'
        workingDirectory = '/app'
        environment = [
            'SPRING_PROFILES_ACTIVE': System.getenv('SPRING_PROFILES_ACTIVE') ?: 'production'
        ]
        labels = [
            'maintainer': 'spring-sse-example',
            'version': project.version,
            'description': 'Spring Boot SSE example application'
        ]
    }
}
