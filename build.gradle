plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'jacoco'
    id 'com.google.cloud.tools.jib' version '3.4.0'
}

group = 'com.example'
version = '1.0.1'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

// Spring Boot puts developmentOnly dependencies on the main runtime classpath, and Jib
// containerizes exactly that classpath. Left alone, devtools ships in the image and —
// because Jib runs an exploded classpath rather than a fat jar — actually activates
// there, opening a LiveReload listener on 35729 (issue #17).
//
// The exclusion is scoped to image builds so that bootRun and IDE runs keep hot reload.
// That scoping is a heuristic, so it is not trusted: verifyNoDevtoolsInImage below
// fails the build if devtools reaches the image by any route.
def imageTaskPattern = ~/(?i).*(jib|verifynodevtoolsinimage).*/
def buildingImage = gradle.startParameter.taskNames.any { imageTaskPattern.matcher(it).matches() }
if (buildingImage) {
    configurations {
        runtimeClasspath {
            exclude group: 'org.springframework.boot', module: 'spring-boot-devtools'
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.5
            }
        }
    }
}

/**
 * Fails the build if spring-boot-devtools reaches the container image (issue #17).
 * Scans the real image tarball rather than reasoning about the classpath, so it holds
 * regardless of how the image was assembled.
 */
tasks.register('verifyNoDevtoolsInImage') {
    group = 'verification'
    description = 'Fails if spring-boot-devtools is present in the built container image'
    dependsOn tasks.named('jibBuildTar')

    doLast {
        def imageTar = layout.buildDirectory.file('jib-image.tar').get().asFile
        def workDir = layout.buildDirectory.dir('image-verify').get().asFile
        project.delete(workDir)
        project.copy {
            from tarTree(imageTar)
            into workDir
        }

        def offenders = []
        def layers = 0
        workDir.eachFileRecurse { file ->
            if (file.name.endsWith('.tar.gz')) {
                layers++
                tarTree(resources.gzip(file)).visit { entry ->
                    if (entry.name.toLowerCase().contains('devtools')) {
                        offenders << entry.path
                    }
                }
            }
        }

        if (!offenders.isEmpty()) {
            throw new GradleException(
                "spring-boot-devtools found in container image: ${offenders.join(', ')}")
        }
        logger.lifecycle("verifyNoDevtoolsInImage: clean (${layers} layers scanned)")
    }
}

// Jib configuration for Docker image building
jib {
    from {
        image = 'eclipse-temurin:17-jre'
    }
    to {
        image = "${System.getenv('DOCKER_REGISTRY') ?: 'docker.io'}/${System.getenv('DOCKER_USERNAME') ?: project.group}/${project.name}:${project.version}"
        // Configure auth for Docker Hub using personal access token
        if (System.getenv('DOCKER_USERNAME') != null && System.getenv('DOCKER_TOKEN') != null) {
            auth {
                username = System.getenv('DOCKER_USERNAME')
                password = System.getenv('DOCKER_TOKEN')
            }
        }
    }
    container {
        jvmFlags = ['-Xmx512m', '-Xms256m', '-XX:+UseG1GC', '-XX:MaxGCPauseMillis=200']
        ports = ['8080']
        user = '1001:1001'
        workingDirectory = '/app'
        environment = [
            'SPRING_PROFILES_ACTIVE': System.getenv('SPRING_PROFILES_ACTIVE') ?: 'production'
        ]
        labels = [
            'maintainer': 'spring-sse-example',
            'version': project.version,
            'description': 'Spring Boot SSE example application'
        ]
    }
}
